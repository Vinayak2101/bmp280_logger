# nginx: expose the collector on a path of an existing CloudPanel site.
#
# Paste this `location` block INSIDE the `server { ... }` block of your site
# (CloudPanel: /etc/nginx/sites-enabled/<domain>.conf), then:
#     nginx -t && systemctl reload nginx
#
# The ESP32 then posts to  https://<domain>/sensors/ingest
# and you can browse         https://<domain>/sensors/

location /sensors/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
}

# ---------------------------------------------------------------- #
